<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Ranking LAN">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="cian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff3ff"/>
      <stop offset="1" stop-color="#00b7d6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#28e5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#28e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rejilla" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#28e5ff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#fondo)"/>
  <rect width="512" height="512" fill="url(#rejilla)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Marco hexagonal del HUD -->
  <path d="M256 54 L430 155 L430 357 L256 458 L82 357 L82 155 Z"
        fill="none" stroke="#28e5ff" stroke-opacity="0.35" stroke-width="4"/>
  <!-- Marcas de esquina -->
  <path d="M256 54 L300 80 M256 54 L212 80 M430 357 L430 310 M82 357 L82 310"
        fill="none" stroke="#28e5ff" stroke-width="8" stroke-linecap="round"/>

  <!-- Podio: tres barras, la central mas alta, con brillo -->
  <g filter="url(#brillo)">
    <rect x="150" y="260" width="60" height="110" rx="4" fill="url(#cian)"/>
    <rect x="226" y="196" width="60" height="174" rx="4" fill="#ff3cac"/>
    <rect x="302" y="292" width="60" height="78" rx="4" fill="url(#cian)"/>
  </g>
  <!-- Estrella sobre el primero -->
  <path d="M256 140 l12 26 28 3 -21 19 6 28 -25 -14 -25 14 6 -28 -21 -19 28 -3 z" fill="#ff3cac"/>

  <!-- LAN -->
  <text x="256" y="428" text-anchor="middle"
        font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="800" letter-spacing="14" fill="#e8f4ff">LAN</text>
</svg>
