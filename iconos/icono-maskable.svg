    <path d="M256 54 L430 155 L430 357 L256 458 L82 357 L82 155 Z" fill="none" stroke="#28e5ff" stroke-opacity="0.35" stroke-width="5"/>
    <rect x="150" y="260" width="60" height="110" rx="4" fill="url(#cian)"/>
    <rect x="226" y="196" width="60" height="174" rx="4" fill="#ff3cac"/>
    <rect x="302" y="292" width="60" height="78" rx="4" fill="url(#cian)"/>
    <path d="M256 140 l12 26 28 3 -21 19 6 28 -25 -14 -25 14 6 -28 -21 -19 28 -3 z" fill="#ff3cac"/>
    <text x="256" y="428" text-anchor="middle" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="14" fill="#e8f4ff">LAN</text>
