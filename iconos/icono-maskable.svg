<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Ranking LAN">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="cian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff3ff"/>
      <stop offset="1" stop-color="#00b7d6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#28e5ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#28e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rejilla" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#28e5ff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
